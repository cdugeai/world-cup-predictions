version = "0.1.0"
source = { virtual = "." }
dependencies = [
    { name = "beautifulsoup4" },
    { name = "duckdb" },
    { name = "pandas" },
    { name = "polars" },
    { name = "scipy" },
    { name = "sqlfluff" },
]

[package.metadata]
requires-dist = [
    { name = "beautifulsoup4", specifier = ">=4.14.3" },
    { name = "duckdb", specifier = ">=1.5.3" },
    { name = "pandas", specifier = ">=3.0.3" },
    { name = "polars", specifier = ">=1.41.2" },
    { name = "scipy", specifier = ">=1.17.1" },
    { name = "sqlfluff", specifier = ">=4.2.2" },
]
